# ~/.config/starship.toml   (generated by ~/.config/starship-gen.py -- do not hand-edit)
#
# LEFT bar  = identity / location, ALWAYS shown, one seamless block-bar:
#     host  user    directory 
#   The "" between the blocks carries the previous block colour as fg
#   and the next as bg (seamless); the final "" points at the cursor.
#
# RIGHT bar = transient / contextual status, shown only when relevant. ONE
#   flat slate bar (background #3B4252); segments share it and are told apart by
#   a coloured icon + coloured text. A literal "" is pinned to the
#   front of right_format (same style as the left bar's "" end) so the
#   command line always sits between a "" and a "" -- it shows
#   even when every status segment is empty. No colour-matched triangles
#   between segments: that needs each to know its neighbours, which Starship
#   can't express for segments that appear/disappear on their own -- EXCEPT
#   [status], which sits at the far right end (matching the old prompt) with
#   every neighbour slate, so its red-block edge triangles are deterministic.
#   Order L->R:
#     cmd_duration  node/go/rust/python  aws  kubernetes  git-state
#     branch + status + line-metrics   exit-code(red block, last)
#
# A padlock () is prepended to the host block when the session is
# privileged -- SSH or root. That is driven by $STARSHIP_PRIV, which ~/.zshrc
# exports once at startup (SSH state and uid don't change mid-shell), so this
# costs nothing per prompt.
#
# GLYPHS are Nerd Font PUA chars; they render only if the terminal font
# resolves to a real Nerd Font by the EXACT name it exposes -- for Ghostty
# here that is "JetBrainsMono Nerd Font Mono" (see the Ghostty config).
# Check:  printf 'lock   x   br   clk   node   py \n'

add_newline = false

format = """
[${env_var.STARSHIP_PRIV}$hostname$username](bg:#434C5E fg:#ECEFF4)\
[](fg:#434C5E bg:#5E81AC)\
[$directory$jobs](bg:#5E81AC fg:#ECEFF4)\
[](bold fg:#5E81AC) """

right_format = """[](bold fg:#3B4252)\
$cmd_duration$nodejs$golang$rust$python$aws$kubernetes$git_state$git_branch$git_status$git_metrics$status"""

# ================================================================= LEFT ====

# Padlock on the host block for a privileged session. $STARSHIP_PRIV is set by
# ~/.zshrc when $SSH_CONNECTION is set or the shell is root; unset otherwise, so
# this whole module disappears with zero per-prompt cost.
[env_var.STARSHIP_PRIV]
variable = "STARSHIP_PRIV"
format = "[ ]($style)"
style = "bg:#434C5E fg:#EBCB8B"

[hostname]
ssh_only = false
disabled = false
format = "[ $hostname ]($style)"
style = "bg:#434C5E fg:#ECEFF4"

[username]
show_always = true
disabled = false
format = "[ $user ]($style)"
style_user = "bg:#434C5E fg:#ECEFF4"
style_root = "bg:#434C5E fg:#ECEFF4"

[directory]
disabled = false
format = "[ $path]($style)[ $read_only]($read_only_style)"
style = "bg:#5E81AC fg:#ECEFF4"
read_only = ""
read_only_style = "bg:#5E81AC fg:#EBCB8B"
truncation_length = 3
truncation_symbol = ".../"

[jobs]
number_threshold = 1
symbol_threshold = 1
format = "[  $symbol$number ]($style)"
style = "bg:#5E81AC fg:#ECEFF4"
symbol = "✦"

# ================================================================ RIGHT ====
# All segments on bg:#3B4252; only the fg colour and icon change per segment.

[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "[  $duration ]($style)"
style = "fg:#AEB9CC bg:#3B4252"

[nodejs]
format = "[  $version ]($style)"
version_format = "v${raw}"
style = "fg:#8CE05A bg:#3B4252"

[golang]
format = "[  $version ]($style)"
version_format = "v${raw}"
style = "fg:#63D4EC bg:#3B4252"

[rust]
format = "[  $version ]($style)"
version_format = "v${raw}"
style = "fg:#F0925A bg:#3B4252"

[python]
format = "[  $version( $virtualenv) ]($style)"
symbol = ""
version_format = "v${raw}"
style = "fg:#F5D24E bg:#3B4252"

[aws]
format = "[  $profile( $region) ]($style)"
style = "fg:#F2A65A bg:#3B4252"

[kubernetes]
disabled = false
detect_files = ['Chart.yaml', 'skaffold.yaml', 'kustomization.yaml']
detect_folders = ['k8s', 'manifests', 'kubernetes', '.helm']
format = "[ ☸ $context( $namespace) ]($style)"
style = "fg:#63D4EC bg:#3B4252"

[git_state]
format = "[ $state( $progress_current/$progress_total) ]($style)"
style = "fg:#DDA9E4 bg:#3B4252 bold"

[status]
# Solid red block at the far-right end of the right bar. Neighbours are always
# slate (#3B4252), so the "" edge triangles are deterministic:
#   [slate -> red]  "  <code> "  [red -> terminal bg]
disabled = false
pipestatus = true
format = "[](fg:#3B4252 bg:#BF616A)[  $status ]($style)[](fg:#BF616A)"
pipestatus_format = "[](fg:#3B4252 bg:#BF616A)[  $pipestatus => $status ]($style)[](fg:#BF616A)"
style = "fg:#ECEFF4 bg:#BF616A bold"

[git_branch]
format = "[  $branch ]($style)"
style = "fg:#A9E080 bg:#3B4252 bold"

[git_status]
# Continues straight after the branch (branch supplied the leading space).
format = "([$all_status$ahead_behind ]($style))"
style = "fg:#D8DEE9 bg:#3B4252"
conflicted = "✖${count}"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
staged = "●${count}"
modified = "✚${count}"
untracked = "?${count}"
stashed = "⚑${count}"

[git_metrics]
disabled = false
only_nonzero_diffs = true
format = "([+$added ]($added_style))([-$deleted ]($deleted_style))"
added_style = "fg:#8CE05A bg:#3B4252"
deleted_style = "fg:#F26D75 bg:#3B4252"
